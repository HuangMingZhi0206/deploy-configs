services:
  web:
    # Follows the moving tag: every push to main rebuilds it, so deploying
    # needs no edit here. To roll back, put a specific build here instead —
    # ghcr.io/huangmingzhi0206/purchase-decision-engine:sha-<short> — then
    # Load compose and redeploy in Coolify.
    image: ghcr.io/huangmingzhi0206/purchase-decision-engine:latest
    restart: unless-stopped
    environment:
      # Coolify fills this in from the domain set on the resource.
      - SERVICE_FQDN_WEB_80
      # nginx forwards /api/ here. The service name is unique per environment so
      # staging and production never reach each other's API on the shared Docker network.
      - API_UPSTREAM=http://pde-api:3000
    expose:
      - "80"

  pde-api:
    # Encrypted-backup API. Rollback: ...:api-sha-<short>.
    image: ghcr.io/huangmingzhi0206/purchase-decision-engine:api-latest
    restart: unless-stopped
    environment:
      # Set these in Coolify (Environment Variables on this resource); no values live in this public repo.
      - DATABASE_URL=${DATABASE_URL}
      - ACCESS_TEAM_DOMAIN=${ACCESS_TEAM_DOMAIN}
      - ACCESS_AUD=${ACCESS_AUD}
      - ALLOWED_EMAILS=${ALLOWED_EMAILS}
    expose:
      - "3000"
