services:
  web:
    image: ghcr.io/huangmingzhi0206/coping-web:latest
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      - SERVICE_FQDN_WEB_8080
      - TRUSTED_PROXY_CIDR=${TRUSTED_PROXY_CIDR}
      - SERVER_NAME=${SERVER_NAME}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  api:
    image: ghcr.io/huangmingzhi0206/coping-api:latest
    restart: unless-stopped
    expose:
      - "3001"
    read_only: true
    tmpfs:
      - /tmp
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - API_PORT=${API_PORT:-3001}
      - API_HOST=${API_HOST:-0.0.0.0}
      - WEB_ORIGIN=${WEB_ORIGIN}
      - SESSION_SECRET=${SESSION_SECRET}
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_MIGRATION_URL=${DATABASE_MIGRATION_URL:-}
      - DATABASE_SSL=${DATABASE_SSL:-false}
      - DATABASE_POOL_MAX=${DATABASE_POOL_MAX:-10}
      - TRUST_PROXY=${TRUST_PROXY:-1}
      - MAILER=${MAILER:-provider}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - MAIL_FROM=${MAIL_FROM}
      - ALLOW_PLACEHOLDER_CONTENT=${ALLOW_PLACEHOLDER_CONTENT:-false}
      - ALLOW_PLACEHOLDER_IN_PRODUCTION=${ALLOW_PLACEHOLDER_IN_PRODUCTION:-false}
      - SAFETY_COUNTRY=${SAFETY_COUNTRY:-ID}
      - RUN_SEED=${RUN_SEED:-false}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3001/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 60s
